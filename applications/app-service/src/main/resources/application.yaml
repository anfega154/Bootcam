##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: Bootcam
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: /h2
  profiles:
    include:
adapters:
  r2dbc:
    host: "localhost"
    port: "5434"
    database: "bootcam"
    schema: "public"
    username: "postgres"
    password: "postgres"

routers:
  paths:
    bootcamp: "/api/v1/bootcamp"